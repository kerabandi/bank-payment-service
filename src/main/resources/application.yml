quarkus:
  application:
    name: bank-payment-service
  log:
    level: INFO
  hibernate-orm:
    mapping:
      format:
        global: ignore
    database:
      default-schema: banking

  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL}

  http:
    port: 8080

mp:
  messaging:
    incoming:
      payments-in:
        connector: smallrye-kafka
        enabled: ${payments.kafka.enabled}